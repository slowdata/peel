name: weekly peel run

on:
  schedule:
    # Sexta às 18:00 UTC — lançamentos já disponíveis, ciclo editorial UK
    # praticamente completo e boa parte do dia editorial norte-americano.
    - cron: "0 18 * * 5"
  # Dispatch manual para testes durante desenvolvimento
  workflow_dispatch:

# Não sobrepor escritas na triagem nem entregas Telegram.
concurrency:
  group: peel-weekly
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  run:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"
    permissions:
      contents: write

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 necessário para git log, commits, etc.
          fetch-depth: 0

      - name: setup uv
        uses: astral-sh/setup-uv@v3

      - name: install dependencies
        run: uv sync --locked --all-groups

      - name: run peel
        run: uv run peel run
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          PEEL_PLAYLIST_ID: ${{ secrets.PEEL_PLAYLIST_ID }}
          PEEL_REVIEW_PLAYLIST_ID: ${{ secrets.PEEL_REVIEW_PLAYLIST_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: generate report
        run: uv run peel report
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          PEEL_PLAYLIST_ID: ${{ secrets.PEEL_PLAYLIST_ID }}
          PEEL_REVIEW_PLAYLIST_ID: ${{ secrets.PEEL_REVIEW_PLAYLIST_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: commit state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "peel-bot"
          git config user.email "peel-bot@users.noreply.github.com"
          git add data/peel.db data/reports/
          # Só comita se houver mudanças (não falha se DB não mudou)
          git diff --cached --quiet || git commit -m "chore: weekly peel state update"
          git push

  failure-alert:
    needs: [tests, run]
    if: ${{ always() && (needs.tests.result == 'failure' || needs.run.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      # Sem checkout, dependências do Peel ou retries de envio.
      - name: notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat:
              sys.exit("Alerta não enviado: configuração Telegram em falta.")
          text = "Peel: a execução semanal falhou.\n" + os.environ["RUN_URL"]
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=urllib.parse.urlencode({"chat_id": chat, "text": text}).encode(),
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise ValueError("Telegram rejeitou o alerta")
          except Exception:
              # Não imprimir a excepção: pode conter o token no URL.
              sys.exit("Não foi possível confirmar o alerta Telegram; envio não repetido.")
          print("Alerta de falha enviado.")
          PY
